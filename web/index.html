<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moonlight — earn from your spare GPU, use open models for less</title>
    <meta name="description" content="Earn from the spare VRAM on your GPU, even while you use it. Use open models for less through one OpenAI-compatible API." />
    <link rel="icon" href="/moon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap"
    />
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        // Dark is the default; older saved values were 'night'/'day'.
        var t = localStorage.getItem('ml-theme');
        document.documentElement.dataset.theme = t === 'light' || t === 'day' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
