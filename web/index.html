<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moonlight — your computer works the night shift</title>
    <meta name="description" content="Sell the models running on your own computer. Use models served from people's homes instead of one factory." />
    <link rel="icon" href="/moon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500..900&family=IBM+Plex+Mono:wght@400;500&family=IM+Fell+English:ital@0;1&family=Schibsted+Grotesk:ital,wght@0,400..800;1,400&display=swap"
    />
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('ml-theme');
        document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
      } catch (e) {
        document.documentElement.dataset.theme = 'night';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
